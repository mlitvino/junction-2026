# Template. The live copy sits on the server in ~/junction-2026 next to Caddyfile and .env.
services:
  app:
    image: ghcr.io/mlitvino/junction-2026:${APP_TAG:-latest}
    env_file: .env
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@db:5432/app
    depends_on: [db]
    restart: unless-stopped

  # No ports: the database is reachable only inside the compose network, as "db".
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped

  caddy:
    image: caddy:2
    # Only 9090: 80/443 are used by the existing valinor.ink app on this server.
    ports: ["9090:9090"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      # Certificate files copied by hand onto the server; never in git or in an image.
      - ./certs:/certs:ro
      - caddy_data:/data
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
